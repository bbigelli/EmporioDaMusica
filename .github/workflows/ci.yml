name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the syntax here requires; 3.13 catches anything
        # that depends on a version-specific behaviour.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot the committed database as SQL
        # Compared as a logical dump, not as bytes. An SQLite file is not
        # reproducible byte-for-byte — the header carries a change counter and
        # page layout depends on write order — so `git diff` on the .db
        # reports a difference on every rebuild even when every row is
        # identical. The dump compares what the database actually contains.
        run: python -c "import sqlite3,pathlib; pathlib.Path('/tmp/before.sql').write_text('\n'.join(sqlite3.connect('data/processed/store.db').iterdump()), encoding='utf-8')"

      - name: Rebuild the data artifacts from source
        # The generated artifacts are committed, so this does not need to run
        # to use the project. It runs here to prove the pipelines still
        # reproduce them from the raw CSVs and PDF — an artifact that has
        # silently drifted from its source is exactly the failure the
        # curated-table verification exists to prevent.
        run: |
          python scripts/build_data.py
          python scripts/build_policies.py

      - name: Check the database still matches its sources
        run: |
          python -c "import sqlite3,pathlib; pathlib.Path('/tmp/after.sql').write_text('\n'.join(sqlite3.connect('data/processed/store.db').iterdump()), encoding='utf-8')"
          if ! diff -q /tmp/before.sql /tmp/after.sql > /dev/null; then
            echo "::error::Rebuilding produced a different database than the committed one."
            diff /tmp/before.sql /tmp/after.sql | head -40
            exit 1
          fi

      - name: Check the generated text artifacts are up to date
        # These are plain text and genuinely byte-stable, so a literal diff is
        # the right check for them.
        run: |
          if ! git diff --quiet -- data/processed/store_policies.md data/processed/policy_sections.json docs/data-quality-report.md; then
            echo "::error::Regenerating the pipelines changed a committed file."
            git diff -- data/processed/store_policies.md data/processed/policy_sections.json docs/data-quality-report.md | head -60
            exit 1
          fi

      - name: Run tests
        # No API key and no network: the agent loop runs against a stub
        # interactions client, so the whole suite is runnable by anyone.
        run: python -m unittest discover -s tests -v

  evals:
    # The evaluation suite talks to the real Gemini API, so it only runs when
    # a key is available — on pull requests from forks it would fail for a
    # reason that has nothing to do with the change. Triggered by hand.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the evaluation suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m evals.run --fail-under 0.9

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/report.md
